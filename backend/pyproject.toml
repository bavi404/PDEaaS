[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pdeflow"
version = "0.1.0"
description = "PDE solutions as a service: Fourier Neural Operator for 2D Darcy flow (PDEBench)"
requires-python = ">=3.11,<3.14"
# Direct dependencies only; exact transitive pins live in requirements.lock (uv pip compile).
dependencies = [
    "torch==2.15.0",
    "neuraloperator==2.0.0",
    "numpy>=1.25,<3",
    "h5py>=3.10",
    "pyyaml>=6",
    "matplotlib>=3.8",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["pdeflow*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["data: requires the downloaded PDEBench file (skipped if absent)"]

[tool.ruff]
line-length = 120
target-version = "py311"
